name: Destroy dev

# Tears down everything in infra/envs/dev to stop all charges. The bootstrap
# stack (state bucket, roles, budget) is left alone on purpose.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy dev" to confirm'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  destroy:
    name: Destroy dev
    if: inputs.confirm == 'destroy dev'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-destroy-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "^1.11"
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: terraform destroy
        run: terraform destroy -input=false -auto-approve -var-file=dev.tfvars
