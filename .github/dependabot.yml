# Weekly update PRs, grouped so they arrive as a few PRs rather than dozens.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/envs/dev
      - /infra/modules/lambda_function
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
